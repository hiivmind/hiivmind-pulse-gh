actions:
  # Skill delegation
  delegate_init:
    type: invoke_skill
    skill: "hiivmind-pulse-gh:hiivmind-pulse-gh-init"
    pass_arguments: true

  delegate_refresh:
    type: invoke_skill
    skill: "hiivmind-pulse-gh:hiivmind-pulse-gh-refresh"
    pass_arguments: true

  delegate_operations:
    type: invoke_skill
    skill: "hiivmind-pulse-gh:hiivmind-pulse-gh-operations"
    pass_arguments: true

  delegate_discover:
    type: invoke_skill
    skill: "hiivmind-pulse-gh:hiivmind-pulse-gh-discover"
    pass_arguments: true

  delegate_awareness:
    type: invoke_skill
    skill: "hiivmind-pulse-gh:hiivmind-pulse-gh-awareness"
    pass_arguments: true

  delegate_workflows:
    type: invoke_skill
    skill: "hiivmind-pulse-gh:hiivmind-pulse-gh-workflows"
    pass_arguments: true

  delegate_heartbeat:
    type: invoke_skill
    skill: "hiivmind-pulse-gh:hiivmind-pulse-gh-heartbeat"
    pass_arguments: true

  # Safety
  block_operation:
    type: display
    content: |
      **Operation blocked for safety.**

      This operation is blocked because it is destructive and hard to reverse:
      - Repository deletion/transfer/archival
      - Organization deletion
      - Default branch deletion

      **Alternatives:**
      - Use the GitHub web UI for these operations
      - Archive instead of delete where possible

      See: `docs/operation-blocklist.md`

  # Interactive menu
  show_main_menu:
    type: user_prompt
    prompt:
      question: "What would you like to do?"
      header: "Action"
      options:
        - id: issues
          label: "Issues"
          description: "Create, update, close, comment, label, assign"
        - id: pull_requests
          label: "Pull Requests"
          description: "Create, merge, review, comment, request reviewers"
        - id: projects
          label: "Projects"
          description: "Add item, update status/fields, archive, view board"
        - id: milestones
          label: "Milestones"
          description: "Create, assign to issue/PR, update, delete"
        - id: actions
          label: "Actions"
          description: "Trigger workflow, view runs, cancel, rerun"
        - id: releases
          label: "Releases"
          description: "Create, upload assets, publish, delete"
        - id: setup
          label: "Setup & Config"
          description: "Initialize workspace, refresh config, awareness"
        - id: discover
          label: "Discover"
          description: "Explore all 25 domains and available operations"

  # Help actions
  show_full_help:
    type: display
    content: |
      ```
      ═══════════════════════════════════════════════════════════
      HIIVMIND-PULSE-GH - GitHub Operations Gateway
      ═══════════════════════════════════════════════════════════

      OPERATIONS
        /hiivmind-pulse-gh create issue ...     Create an issue
        /hiivmind-pulse-gh close issue #42      Close an issue
        /hiivmind-pulse-gh merge pr #15         Merge a pull request
        /hiivmind-pulse-gh set milestone ...    Set milestone on issue/PR
        /hiivmind-pulse-gh trigger workflow ... Trigger a workflow

      SETUP
        /hiivmind-pulse-gh init                 Initialize workspace
        /hiivmind-pulse-gh refresh              Sync stale config
        /hiivmind-pulse-gh discover             Explore all operations
        /hiivmind-pulse-gh awareness            Configure CLAUDE.md

      DOMAINS (25)
        Issues, Pull Requests, Milestones, Labels, Projects v2,
        Branch Protection, Rulesets, Actions, Secrets, Variables,
        Releases, Repositories, Collaborators, Teams, Checks,
        Deployments, Environments, Webhooks, Code Scanning,
        Secret Scanning, Dependabot, Notifications, Reactions,
        Search, Gists

      HELP
        /hiivmind-pulse-gh --help               This help screen
        /hiivmind-pulse-gh help init            Help for init skill
        /hiivmind-pulse-gh help refresh         Help for refresh skill

      ═══════════════════════════════════════════════════════════
      ```

  show_skill_help_init:
    type: display
    content: |
      ## hiivmind-pulse-gh-init

      **Purpose:** One-time workspace setup that caches project/field IDs.

      **Usage:** `/hiivmind-pulse-gh init`

      **What it does:**
      1. Verifies tools (gh, jq, yq) and authentication
      2. Detects workspace from git remote
      3. Discovers Projects v2 and field configurations
      4. Writes config.yaml, user.yaml, freshness.yaml

      **Run when:** First time, or "workspace not initialized" errors.

  show_skill_help_refresh:
    type: display
    content: |
      ## hiivmind-pulse-gh-refresh

      **Purpose:** Sync cached config with current GitHub state.

      **Usage:** `/hiivmind-pulse-gh refresh [section]`

      **Sections:** workspace, projects, views, repo_settings, automations, relationships, teams

      **Run when:** "ID not found" errors, stale config, after GitHub UI changes.

  show_skill_help_discover:
    type: display
    content: |
      ## hiivmind-pulse-gh-discover

      **Purpose:** Explore available operations across all 25 domains.

      **Usage:** `/hiivmind-pulse-gh discover`

      **What it does:**
      1. Shows quick reference table of all domains
      2. Drill down into domain-specific operation matrices
      3. Hands off to operations skill when ready

  show_skill_help_awareness:
    type: display
    content: |
      ## hiivmind-pulse-gh-awareness

      **Purpose:** Configure CLAUDE.md with plugin awareness.

      **Usage:** `/hiivmind-pulse-gh awareness`

      **What it does:**
      1. Asks user-level or repo-level scope
      2. Presents What/When/How skill overview
      3. Generates and injects awareness section into CLAUDE.md

  show_skill_help_operations:
    type: display
    content: |
      ## hiivmind-pulse-gh-operations

      **Purpose:** Execute any GitHub operation with context enrichment.

      **Usage:** `/hiivmind-pulse-gh [domain] [operation] [target]`

      **Examples:**
      - `/hiivmind-pulse-gh create issue for login bug`
      - `/hiivmind-pulse-gh set milestone v2.0 on #42`
      - `/hiivmind-pulse-gh trigger workflow ci.yml`
      - `/hiivmind-pulse-gh add PR to project`

      **Enrichment:** Issues auto-linked to project, status fields set,
      milestones resolved from name to ID.
