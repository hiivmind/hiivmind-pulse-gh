[project]
name = "hiivmind-pulse-gh-dev"
version = "0.0.0"
description = "Dev/test environment for hiivmind-pulse-gh plugin scripts (the scripts themselves are PEP 723 self-contained)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pulse-apply-doc-patch = "lib.pulse.scripts.apply_doc_patch_entry:main"
pulse-apply-marketplace-entry = "lib.pulse.scripts.apply_marketplace_entry:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
]

[tool.pytest.ini_options]
testpaths = ["lib/pulse/scripts/tests"]
pythonpath = ["."]
