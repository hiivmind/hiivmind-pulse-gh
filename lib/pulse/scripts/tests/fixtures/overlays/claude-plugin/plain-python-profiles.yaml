repository_profiles:
  acme/python-lib:
    profiles: [python]
    scorecard: generic-v1

scorecards:
  generic-v1:
    checks:
      - id: documentation
        adapter: generic.docs
        weight: 1
      - id: ci
        adapter: github.actions
        applicability: capability:ci
        weight: 1

adapters:
  generic.docs:
    state: available
  github.actions:
    state: available
