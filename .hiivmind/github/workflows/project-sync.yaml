# hiivmind-pulse-gh - Project Sync Workflow
# Detects changes in project board items and user assignments
# Copy to: .hiivmind/github/workflows/project-sync.yaml
# Note: Requires default project set in config.yaml — skipped if unset

name: "project-sync"
description: "Detect project board changes and summarize updates"
enabled: true
auto: false

trigger:
  type: session_poll
  source: projects
  condition: state_changed
  filter: {}

actions:
  - name: "Summarize assignment changes"
    type: operation
    operation: "show my current project assignments across all projects, highlighting any changes since last session"

cooldown_minutes: 30
