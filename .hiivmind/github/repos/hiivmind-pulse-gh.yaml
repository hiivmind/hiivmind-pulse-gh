repository:
  name: hiivmind-pulse-gh
  full_name: hiivmind/gh
  default_branch: main

branch_protection:
  main:
    required_pull_request_reviews:
      dismiss_stale_reviews: true
      required_approving_review_count: 1
    enforce_admins: false
    allow_force_pushes: false
    allow_deletions: false

labels:
  - name: adr
    color: "0052cc"
    description: "Architecture Decision Record"
  - name: api-routing
    color: "0366d6"
    description: "API routing guide enhancement"
  - name: bug
    color: d73a4a
    description: "Something isn't working"
  - name: documentation
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: duplicate
    color: cfd3d7
    description: "This issue or pull request already exists"
  - name: enhancement
    color: a2eeef
    description: "New feature or request"
  - name: "for review"
    color: "0E8A16"
    description: "Ready for review"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: infrastructure
    color: "1D76DB"
    description: "Build, CI/CD, and tooling infrastructure"
  - name: invalid
    color: e4e669
    description: "This doesn't seem right"
  - name: iteration-2
    color: c2e0c6
    description: "v5 Architecture - Iteration 2"
  - name: iteration-3
    color: d4c5f9
    description: "v5 Architecture - Iteration 3"
  - name: iteration-4
    color: f9d0c4
    description: "v5 Architecture - Iteration 4"
  - name: question
    color: d876e3
    description: "Further information is requested"
  - name: refactor
    color: FBCA04
    description: "Code refactoring and restructuring"
  - name: testing
    color: "0E8A16"
    description: "Testing framework and test infrastructure"
  - name: wontfix
    color: ffffff
    description: "This will not be worked on"
